[project]
name = "applemusicdecrypt"
version = "0.2.0"
description = "Apple Music decryption tool"
authors = [{ name = "WorldObservationLog", email = "wolc@duck.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "regex>=2026.2.28",
    "pydantic>=2.12.5",
    "loguru>=0.7.2",
    "lxml>=6.0.2",
    "beautifulsoup4>=4.14.3",
    "m3u8>=6.0.0",
    "tenacity>=9.1.4",
    "prompt-toolkit>=3.0.52",
    "pywidevine>=1.9.0",
    "creart>=0.3.0",
    "mutagen>=1.47.0",
    "async-lru>=2.2.0",
    "tabulate>=0.10.0",
    "temari>=0.1.0",
    "pycryptodome>=3.20.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
]
